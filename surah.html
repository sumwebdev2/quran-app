<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Quran Reader</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            arabic: ["Amiri", "serif"]
          }
        }
      }
    };
  </script>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://unpkg.com/lucide@latest"></script>

  <link
    rel="stylesheet"
    href="surah.css"
  >

</head>


<body class="min-h-screen bg-slate-950 text-white">

  <div
    class="
      mx-auto
      min-h-screen
      max-w-md
      overflow-x-hidden
      bg-slate-900
    "
  >


    <!-- HEADER -->

    <header
      class="
        sticky
        top-0
        z-40
        border-b
        border-white/10
        bg-slate-900/95
        px-5
        py-4
        backdrop-blur-xl
      "
    >

      <div class="flex items-center gap-3">

        <button
          id="backButton"
          class="
            grid
            h-10
            w-10
            shrink-0
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
          "
        >
          <i data-lucide="arrow-left"></i>
        </button>


        <div class="min-w-0">

          <p
            class="
              text-[10px]
              uppercase
              tracking-[0.25em]
              text-emerald-400
            "
          >
            Quran
          </p>

          <h1
            id="surahTitle"
            class="truncate font-bold"
          >
            Loading...
          </h1>

        </div>


        <button
          id="bookmarkButton"
          class="
            ml-auto
            grid
            h-10
            w-10
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
          "
        >
          <i data-lucide="bookmark"></i>
        </button>

      </div>

    </header>


    <!-- QURAN -->

    <main
      id="quranContent"
      class="px-4 pb-44 pt-5"
    >

      <div class="py-20 text-center">

        <div
          class="
            mx-auto
            h-9
            w-9
            animate-spin
            rounded-full
            border-2
            border-slate-700
            border-t-emerald-400
          "
        ></div>

        <p class="mt-4 text-sm text-slate-400">
          Loading Surah...
        </p>

      </div>

    </main>


    <!-- MINI PLAYER -->

    <div
      id="audioBar"
      class="
        fixed
        bottom-0
        left-0
        right-0
        z-50
        mx-auto
        hidden
        max-w-md
        border-t
        border-white/10
        bg-slate-900/95
        p-3
        backdrop-blur-xl
      "
    >

      <div
        class="
          absolute
          left-0
          right-0
          top-0
          h-0.5
          bg-white/5
        "
      >

        <div
          id="miniProgress"
          class="h-full w-0 bg-emerald-400"
        ></div>

      </div>


      <div class="flex items-center gap-3">

        <button
          id="openPlayerButton"
          class="shrink-0"
        >

          <div
            id="miniDisc"
            class="vinyl h-11 w-11"
          ></div>

        </button>


        <button
          id="openPlayerButton2"
          class="min-w-0 flex-1 text-left"
        >

          <p
            id="audioTitle"
            class="truncate text-sm font-semibold"
          >
            Quran
          </p>

          <p
            id="audioSubtitle"
            class="truncate text-xs text-slate-400"
          >
            Mishary Rashid Alafasy
          </p>

        </button>


        <button
          id="previousAyahButton"
          class="grid h-9 w-9 place-items-center"
        >
          <i data-lucide="skip-back"></i>
        </button>


        <button
          id="playButton"
          class="
            grid
            h-11
            w-11
            shrink-0
            place-items-center
            rounded-full
            bg-emerald-500
            text-slate-950
          "
        >
          <i
            data-lucide="play"
            class="fill-current"
          ></i>
        </button>


        <button
          id="nextAyahButton"
          class="grid h-9 w-9 place-items-center"
        >
          <i data-lucide="skip-forward"></i>
        </button>

      </div>

    </div>


    <!-- PLAYER OVERLAY -->

    <div
      id="playerOverlay"
      class="
        fixed
        inset-0
        z-[70]
        hidden
        bg-black/70
        backdrop-blur-sm
      "
    ></div>


    <!-- FULL PLAYER -->

    <section
      id="playerSheet"
      class="
        fixed
        bottom-0
        left-0
        right-0
        z-[80]
        mx-auto
        hidden
        max-w-md
        rounded-t-[32px]
        border
        border-white/10
        bg-slate-900
        px-5
        pb-8
        pt-4
      "
    >

      <div
        class="
          mx-auto
          mb-4
          h-1
          w-12
          rounded-full
          bg-white/20
        "
      ></div>


      <div class="flex justify-end">

        <button
          id="closePlayerButton"
          class="
            grid
            h-10
            w-10
            place-items-center
            rounded-full
            bg-white/5
          "
        >
          <i data-lucide="chevron-down"></i>
        </button>

      </div>


      <div class="flex justify-center py-4">

        <div
          id="fullDisc"
          class="vinyl h-48 w-48"
        ></div>

      </div>


      <div class="text-center">

        <h2
          id="fullPlayerTitle"
          class="text-xl font-bold"
        >
          Quran
        </h2>

        <p
          id="fullPlayerReciter"
          class="mt-1 text-sm text-slate-400"
        >
          Mishary Rashid Alafasy
        </p>

        <p
          id="currentAyahLabel"
          class="mt-2 text-xs text-emerald-400"
        >
          Ayah 1
        </p>

      </div>


      <!-- WHOLE SURAH PROGRESS -->

      <div class="mt-7">

        <input
          id="seekBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          class="quran-range"
        >

        <div
          class="
            mt-2
            flex
            justify-between
            text-xs
            text-slate-500
          "
        >

          <span id="currentTime">
            0:00
          </span>

          <span id="remainingTime">
            -0:00
          </span>

        </div>

      </div>


      <!-- CONTROLS -->

      <div
        class="
          mt-6
          flex
          items-center
          justify-center
          gap-5
        "
      >

        <button
          id="speedButton"
          class="
            grid
            h-10
            min-w-10
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
            text-xs
          "
        >

          <span id="speedLabel">
            1×
          </span>

        </button>


        <button
          id="fullPreviousButton"
          class="
            grid
            h-12
            w-12
            place-items-center
            rounded-full
            bg-white/5
          "
        >
          <i data-lucide="skip-back"></i>
        </button>


        <button
          id="fullPlayButton"
          class="
            grid
            h-16
            w-16
            place-items-center
            rounded-full
            bg-emerald-500
            text-slate-950
          "
        >
          <i
            data-lucide="play"
            class="h-7 w-7"
          ></i>
        </button>


        <button
          id="fullNextButton"
          class="
            grid
            h-12
            w-12
            place-items-center
            rounded-full
            bg-white/5
          "
        >
          <i data-lucide="skip-forward"></i>
        </button>


        <button
          id="repeatButton"
          class="
            grid
            h-10
            min-w-10
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
          "
        >
          <i data-lucide="repeat"></i>
        </button>

      </div>


      <p
        id="repeatLabel"
        class="
          mt-3
          text-center
          text-xs
          text-slate-500
        "
      >
        Repeat off
      </p>


      <!-- RECITER -->

      <div class="mt-6">

        <label
          class="
            mb-2
            block
            text-xs
            uppercase
            tracking-wider
            text-slate-500
          "
        >
          Reciter
        </label>


        <select
          id="reciterSelect"
          class="
            w-full
            rounded-2xl
            border
            border-white/10
            bg-white/5
            px-4
            py-4
            text-sm
            outline-none
          "
        >

          <option value="Alafasy_128kbps">
            Mishary Rashid Alafasy
          </option>

          <option value="Abdul_Basit_Murattal_192kbps">
            Abdul Basit Abdul Samad
          </option>

          <option value="Abdurrahmaan_As-Sudais_192kbps">
            Abdul Rahman Al-Sudais
          </option>

          <option value="Husary_128kbps">
            Mahmoud Khalil Al-Husary
          </option>

          <option value="Saood_ash-Shuraym_128kbps">
            Saud Al-Shuraim
          </option>

          <option value="Abu_Bakr_Ash-Shaatree_128kbps">
            Abu Bakr Al-Shatri
          </option>

        </select>

      </div>

    </section>


    <!-- HIDDEN AUDIO ELEMENTS -->

    <audio
      id="audioA"
      preload="auto"
    ></audio>

    <audio
      id="audioB"
      preload="auto"
    ></audio>

  </div>


  <script src="surah.js"></script>

</body>

</html>
