<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="Quran Reader - Read and listen to the Holy Quran"
  >

  <title>Quran Reader</title>


  <!-- Tailwind -->

  <script src="https://cdn.tailwindcss.com"></script>


  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            arabic: [
              "Amiri",
              "serif"
            ]

          }

        }

      }

    };

  </script>


  <!-- Arabic font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- Lucide -->

  <script
    src="https://unpkg.com/lucide@latest"
  ></script>


  <style>

    /*
     * Prevent horizontal overflow.
     */

    html,
    body {

      width: 100%;

      max-width: 100%;

      overflow-x: hidden;

    }


    /*
     * Quran Arabic text.
     */

    .quran-text {

      width: 100%;

      max-width: 100%;

      overflow-wrap: anywhere;

      word-break: normal;

      white-space: normal;

    }


    /*
     * Active ayah.
     */

    .ayah.active-ayah {

      background:
        rgba(16, 185, 129, 0.08);

      border-color:
        rgba(16, 185, 129, 0.25);

      box-shadow:
        0 0 0 1px
        rgba(16, 185, 129, 0.15);

    }

  </style>

</head>


<body
  class="min-h-screen
         w-full
         overflow-x-hidden
         bg-slate-950
         text-white"
>


  <div
    class="mx-auto
           min-h-screen
           w-full
           max-w-md
           overflow-x-hidden
           bg-slate-900
           shadow-2xl"
  >


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
      class="sticky
             top-0
             z-20
             w-full
             border-b
             border-white/10
             bg-slate-900/95
             px-4
             py-4
             backdrop-blur"
    >

      <div
        class="flex
               min-w-0
               items-center
               gap-3"
      >

        <button
          onclick="history.back()"
          class="shrink-0
                 rounded-full
                 border
                 border-white/10
                 bg-white/5
                 p-2.5
                 transition
                 active:scale-95"
          aria-label="Go back"
        >

          <i
            data-lucide="arrow-left"
            class="h-5 w-5"
          ></i>

        </button>


        <div
          class="min-w-0
                 flex-1"
        >

          <p
            class="text-xs
                   uppercase
                   tracking-widest
                   text-emerald-400"
          >
            Quran
          </p>


          <h1
            id="surahTitle"
            class="truncate
                   font-bold"
          >
            Loading...
          </h1>

        </div>


        <button
          id="surahBookmark"
          class="shrink-0
                 rounded-full
                 border
                 border-white/10
                 bg-white/5
                 p-2.5
                 text-slate-300
                 transition
                 active:scale-95"
          aria-label="Bookmark Surah"
        >

          <i
            data-lucide="bookmark"
            class="h-5 w-5"
          ></i>

        </button>

      </div>

    </header>


    <!-- =====================================================
         QURAN CONTENT
    ====================================================== -->

    <main
      id="quranContent"
      class="w-full
             overflow-x-hidden
             px-4
             pb-44
             pt-6"
    >

      <div
        class="py-16
               text-center"
      >

        <div
          class="mx-auto
                 h-9
                 w-9
                 animate-spin
                 rounded-full
                 border-2
                 border-slate-600
                 border-t-emerald-400"
        ></div>


        <p
          class="mt-4
                 text-sm
                 text-slate-400"
        >
          Loading Surah...
        </p>

      </div>

    </main>


    <!-- =====================================================
         AUDIO PLAYER
    ====================================================== -->

    <div
      id="audioBar"
      class="fixed
             bottom-0
             left-0
             right-0
             z-30
             mx-auto
             hidden
             w-full
             max-w-md
             border-t
             border-white/10
             bg-slate-900/95
             px-4
             py-3
             shadow-2xl
             backdrop-blur"
    >

      <!-- PROGRESS -->

      <div
        class="mb-3
               h-1
               w-full
               overflow-hidden
               rounded-full
               bg-slate-700"
      >

        <div
          id="audioProgress"
          class="h-full
                 w-0
                 rounded-full
                 bg-emerald-500"
        ></div>

      </div>


      <div
        class="flex
               min-w-0
               items-center
               gap-3"
      >


        <!-- PLAY -->

        <button
          id="playButton"
          class="grid
                 h-12
                 w-12
                 shrink-0
                 place-items-center
                 rounded-full
                 bg-emerald-500
                 text-slate-950
                 shadow-lg
                 transition
                 active:scale-95"
          aria-label="Play Surah"
        >

          <i
            data-lucide="play"
            class="h-5
                   w-5
                   fill-current"
          ></i>

        </button>


        <!-- INFORMATION -->

        <div
          class="min-w-0
                 flex-1"
        >

          <p
            id="audioTitle"
            class="truncate
                   text-sm
                   font-semibold"
          >
            Quran Recitation
          </p>


          <p
            id="audioSubtitle"
            class="truncate
                   text-xs
                   text-slate-400"
          >
            Mishary Rashid Alafasy
          </p>

        </div>


        <!-- PREVIOUS -->

        <button
          id="previousAyahButton"
          class="hidden
                 shrink-0
                 rounded-full
                 border
                 border-white/10
                 p-2.5
                 text-slate-400
                 transition
                 active:scale-95"
          aria-label="Previous Ayah"
        >

          <i
            data-lucide="skip-back"
            class="h-5 w-5"
          ></i>

        </button>


        <!-- NEXT -->

        <button
          id="nextAyahButton"
          class="hidden
                 shrink-0
                 rounded-full
                 border
                 border-white/10
                 p-2.5
                 text-slate-400
                 transition
                 active:scale-95"
          aria-label="Next Ayah"
        >

          <i
            data-lucide="skip-forward"
            class="h-5 w-5"
          ></i>

        </button>

      </div>


      <!-- TIME -->

      <div
        class="mt-2
               flex
               justify-between
               text-[11px]
               text-slate-500"
      >

        <span id="currentTime">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

    </div>


  </div>


  <script src="surah.js"></script>


  <script>

    lucide.createIcons();

  </script>


</body>

</html>
