<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="Quran Reader"
  >

  <title>Quran Reader</title>


  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>


  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            arabic: [
              "Amiri",
              "serif"
            ]

          }

        }

      }

    };

  </script>


  <!-- Arabic Font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- Lucide Icons -->

  <script
    src="https://unpkg.com/lucide@latest"
  ></script>


  <style>

    html,
    body {

      width: 100%;

      max-width: 100%;

      overflow-x: hidden;

    }


    body {

      margin: 0;

    }


    .ayah {

      width: 100%;

      max-width: 100%;

      min-width: 0;

      overflow: hidden;

      transition:
        background-color .35s ease,
        box-shadow .35s ease,
        border-color .35s ease;

    }


    .ayah.active {

      background:
        rgba(16, 185, 129, .08);

      border-color:
        rgba(16, 185, 129, .30);

      box-shadow:
        0 0 0 1px
        rgba(16, 185, 129, .15);

    }


    .quran-arabic {

      width: 100%;

      max-width: 100%;

      overflow-wrap: anywhere;

      word-break: normal;

      white-space: normal;

      line-height: 2.35;

    }


    .translation {

      overflow-wrap: anywhere;

      word-break: normal;

    }


    #audioProgress {

      transition:
        width .15s linear;

    }

  </style>

</head>


<body
  class="
    min-h-screen
    w-full
    overflow-x-hidden
    bg-slate-950
    text-white
  "
>


  <div
    class="
      mx-auto
      min-h-screen
      w-full
      max-w-md
      overflow-x-hidden
      bg-slate-900
    "
  >


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
      class="
        sticky
        top-0
        z-20
        w-full
        border-b
        border-white/10
        bg-slate-900/95
        px-4
        py-4
        backdrop-blur
      "
    >

      <div
        class="
          flex
          min-w-0
          items-center
          gap-3
        "
      >

        <button
          onclick="history.back()"
          class="
            shrink-0
            rounded-full
            border
            border-white/10
            bg-white/5
            p-2.5
            active:scale-95
          "
          aria-label="Back"
        >

          <i
            data-lucide="arrow-left"
            class="h-5 w-5"
          ></i>

        </button>


        <div
          class="
            min-w-0
            flex-1
          "
        >

          <p
            class="
              text-xs
              uppercase
              tracking-widest
              text-emerald-400
            "
          >
            Quran
          </p>


          <h1
            id="surahTitle"
            class="
              truncate
              font-bold
            "
          >
            Loading...
          </h1>

        </div>


        <button
          id="surahBookmark"
          class="
            shrink-0
            rounded-full
            border
            border-white/10
            bg-white/5
            p-2.5
            active:scale-95
          "
          aria-label="Bookmark Surah"
        >

          <i
            data-lucide="bookmark"
            class="h-5 w-5"
          ></i>

        </button>

      </div>

    </header>


    <!-- =====================================================
         QURAN
    ====================================================== -->

    <main
      id="quranContent"
      class="
        w-full
        overflow-x-hidden
        px-4
        pb-44
        pt-6
      "
    >

      <div
        class="
          py-16
          text-center
        "
      >

        <div
          class="
            mx-auto
            h-9
            w-9
            animate-spin
            rounded-full
            border-2
            border-slate-600
            border-t-emerald-400
          "
        ></div>


        <p
          class="
            mt-4
            text-sm
            text-slate-400
          "
        >
          Loading Surah...
        </p>

      </div>

    </main>


    <!-- =====================================================
         AUDIO PLAYER
    ====================================================== -->

    <div
      id="audioBar"
      class="
        fixed
        bottom-0
        left-0
        right-0
        z-30
        mx-auto
        hidden
        w-full
        max-w-md
        border-t
        border-white/10
        bg-slate-900/95
        px-4
        py-3
        shadow-2xl
        backdrop-blur
      "
    >

      <!-- SEEK BAR -->

      <input
        id="seekBar"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        class="
          mb-3
          h-1
          w-full
          cursor-pointer
          appearance-none
          rounded-full
          bg-slate-700
        "
        aria-label="Seek"
      >


      <div
        class="
          flex
          min-w-0
          items-center
          gap-2
        "
      >


        <!-- PREVIOUS -->

        <button
          id="previousAyahButton"
          class="
            shrink-0
            rounded-full
            border
            border-white/10
            p-2
            text-slate-300
            active:scale-95
          "
          aria-label="Previous Ayah"
        >

          <i
            data-lucide="skip-back"
            class="h-4 w-4"
          ></i>

        </button>


        <!-- PLAY -->

        <button
          id="playButton"
          class="
            grid
            h-12
            w-12
            shrink-0
            place-items-center
            rounded-full
            bg-emerald-500
            text-slate-950
            active:scale-95
          "
          aria-label="Play Surah"
        >

          <i
            data-lucide="play"
            class="
              h-5
              w-5
              fill-current
            "
          ></i>

        </button>


        <!-- NEXT -->

        <button
          id="nextAyahButton"
          class="
            shrink-0
            rounded-full
            border
            border-white/10
            p-2
            text-slate-300
            active:scale-95
          "
          aria-label="Next Ayah"
        >

          <i
            data-lucide="skip-forward"
            class="h-4 w-4"
          ></i>

        </button>


        <!-- INFO -->

        <div
          class="
            min-w-0
            flex-1
          "
        >

          <p
            id="audioTitle"
            class="
              truncate
              text-sm
              font-semibold
            "
          >
            Quran Recitation
          </p>


          <p
            id="audioSubtitle"
            class="
              truncate
              text-xs
              text-slate-400
            "
          >
            Mishary Rashid Alafasy
          </p>

        </div>


        <!-- MORE -->

        <button
          id="audioMoreButton"
          class="
            shrink-0
            rounded-full
            border
            border-white/10
            p-2
            text-slate-400
          "
          aria-label="Audio options"
        >

          <i
            data-lucide="more-vertical"
            class="h-4 w-4"
          ></i>

        </button>

      </div>


      <!-- TIME -->

      <div
        class="
          mt-2
          flex
          justify-between
          text-[11px]
          text-slate-500
        "
      >

        <span id="currentTime">
          0:00
        </span>

        <span id="duration">
          0:00
        </span>

      </div>

    </div>

  </div>


  <script src="surah.js"></script>


  <script>

    lucide.createIcons();

  </script>

</body>

  </html>
