<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <title>Quran Reader</title>


  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>

  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            arabic: [
              "Amiri",
              "serif"
            ]

          }

        }

      }

    };

  </script>


  <!-- Arabic font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- Lucide -->

  <script src="https://unpkg.com/lucide@latest"></script>


  <!-- App CSS -->

  <link
    rel="stylesheet"
    href="surah.css"
  >

</head>


<body class="min-h-screen bg-slate-950 text-white">


  <!-- APP -->

  <div
    class="
      mx-auto
      min-h-screen
      max-w-md
      overflow-x-hidden
      bg-slate-900
      shadow-2xl
    "
  >


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
      class="
        sticky
        top-0
        z-40
        border-b
        border-white/10
        bg-slate-900/95
        px-5
        py-4
        backdrop-blur-xl
      "
    >

      <div class="flex items-center gap-3">


        <button
          id="backButton"
          type="button"
          class="
            grid
            h-10
            w-10
            shrink-0
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
            active:scale-95
          "
        >

          <i
            data-lucide="arrow-left"
            class="h-5 w-5"
          ></i>

        </button>


        <div class="min-w-0">

          <p
            class="
              text-[10px]
              font-semibold
              uppercase
              tracking-[0.25em]
              text-emerald-400
            "
          >
            Quran
          </p>

          <h1
            id="surahTitle"
            class="
              truncate
              text-base
              font-bold
            "
          >
            Loading...
          </h1>

        </div>


        <button
          id="bookmarkButton"
          type="button"
          class="
            ml-auto
            grid
            h-10
            w-10
            shrink-0
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
            active:scale-95
          "
        >

          <i
            data-lucide="bookmark"
            class="h-5 w-5"
          ></i>

        </button>

      </div>

    </header>



    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <main
      id="quranContent"
      class="
        px-4
        pb-44
        pt-5
      "
    >

      <div class="py-20 text-center">

        <div
          class="
            mx-auto
            h-9
            w-9
            animate-spin
            rounded-full
            border-2
            border-slate-700
            border-t-emerald-400
          "
        ></div>

        <p
          class="
            mt-4
            text-sm
            text-slate-400
          "
        >
          Loading Surah...
        </p>

      </div>

    </main>



    <!-- =====================================================
         MINI PLAYER
    ====================================================== -->

    <div
      id="audioBar"
      class="
        fixed
        bottom-0
        left-0
        right-0
        z-50
        mx-auto
        hidden
        max-w-md
        border-t
        border-white/10
        bg-slate-900/95
        p-3
        backdrop-blur-xl
      "
    >

      <!-- Progress -->

      <div
        class="
          absolute
          left-0
          right-0
          top-0
          h-0.5
          bg-white/5
        "
      >

        <div
          id="miniProgress"
          class="
            h-full
            w-0
            bg-emerald-400
          "
        ></div>

      </div>


      <div class="flex items-center gap-3">


        <!-- Mini disc -->

        <button
          id="openPlayerButton"
          type="button"
          class="shrink-0"
        >

          <div
            id="miniDisc"
            class="
              vinyl
              h-11
              w-11
            "
          >

            <div class="vinyl-hole"></div>

          </div>

        </button>


        <!-- Information -->

        <button
          id="openPlayerButton2"
          type="button"
          class="
            min-w-0
            flex-1
            text-left
          "
        >

          <p
            id="audioTitle"
            class="
              truncate
              text-sm
              font-semibold
            "
          >
            Quran
          </p>

          <p
            id="audioSubtitle"
            class="
              truncate
              text-xs
              text-slate-400
            "
          >
            Mishary Rashid Alafasy
          </p>

        </button>


        <!-- Previous -->

        <button
          id="previousAyahButton"
          type="button"
          class="
            grid
            h-9
            w-9
            shrink-0
            place-items-center
            rounded-full
            text-slate-300
            active:bg-white/10
          "
        >

          <i
            data-lucide="skip-back"
            class="h-4 w-4"
          ></i>

        </button>


        <!-- Play -->

        <button
          id="playButton"
          type="button"
          class="
            grid
            h-11
            w-11
            shrink-0
            place-items-center
            rounded-full
            bg-emerald-500
            text-slate-950
            shadow-lg
            shadow-emerald-500/10
            active:scale-95
          "
        >

          <i
            data-lucide="play"
            class="h-5 w-5 fill-current"
          ></i>

        </button>


        <!-- Next -->

        <button
          id="nextAyahButton"
          type="button"
          class="
            grid
            h-9
            w-9
            shrink-0
            place-items-center
            rounded-full
            text-slate-300
            active:bg-white/10
          "
        >

          <i
            data-lucide="skip-forward"
            class="h-4 w-4"
          ></i>

        </button>

      </div>

    </div>



    <!-- =====================================================
         FULL PLAYER
    ====================================================== -->

    <div
      id="playerOverlay"
      class="
        fixed
        inset-0
        z-[70]
        hidden
        bg-black/70
        backdrop-blur-sm
      "
    ></div>


    <section
      id="playerSheet"
      class="
        fixed
        bottom-0
        left-0
        right-0
        z-[80]
        mx-auto
        hidden
        max-w-md
        rounded-t-[32px]
        border
        border-white/10
        bg-slate-900
        px-5
        pb-8
        pt-4
        shadow-2xl
      "
    >

      <!-- Handle -->

      <div
        class="
          mx-auto
          mb-5
          h-1
          w-12
          rounded-full
          bg-white/20
        "
      ></div>


      <!-- Close -->

      <div class="flex justify-end">

        <button
          id="closePlayerButton"
          type="button"
          class="
            grid
            h-10
            w-10
            place-items-center
            rounded-full
            bg-white/5
          "
        >

          <i
            data-lucide="chevron-down"
            class="h-5 w-5"
          ></i>

        </button>

      </div>


      <!-- Disc -->

      <div class="flex justify-center py-4">

        <div
          id="fullDisc"
          class="
            vinyl
            h-48
            w-48
            shadow-2xl
          "
        >

          <div class="vinyl-hole"></div>

        </div>

      </div>


      <!-- Track -->

      <div class="text-center">

        <p
          id="fullPlayerTitle"
          class="
            text-xl
            font-bold
          "
        >
          Quran
        </p>

        <p
          id="fullPlayerReciter"
          class="
            mt-1
            text-sm
            text-slate-400
          "
        >
          Mishary Rashid Alafasy
        </p>

        <p
          id="currentAyahLabel"
          class="
            mt-2
            text-xs
            text-emerald-400
          "
        >
          Ayah 1
        </p>

      </div>


      <!-- Seek -->

      <div class="mt-7">

        <input
          id="seekBar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          class="quran-range"
        >


        <div
          class="
            mt-2
            flex
            justify-between
            text-[11px]
            text-slate-500
          "
        >

          <span id="currentTime">
            0:00
          </span>

          <span id="remainingTime">
            -0:00
          </span>

        </div>

      </div>


      <!-- Controls -->

      <div
        class="
          mt-6
          flex
          items-center
          justify-center
          gap-5
        "
      >

        <!-- Speed -->

        <button
          id="speedButton"
          type="button"
          class="
            grid
            h-11
            min-w-11
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
            text-xs
            font-bold
          "
        >

          <span id="speedLabel">
            1×
          </span>

        </button>


        <!-- Previous -->

        <button
          id="fullPreviousButton"
          type="button"
          class="
            grid
            h-12
            w-12
            place-items-center
            rounded-full
            bg-white/5
            active:scale-95
          "
        >

          <i
            data-lucide="skip-back"
            class="h-5 w-5"
          ></i>

        </button>


        <!-- Play -->

        <button
          id="fullPlayButton"
          type="button"
          class="
            grid
            h-16
            w-16
            place-items-center
            rounded-full
            bg-emerald-500
            text-slate-950
            shadow-xl
            shadow-emerald-500/20
            active:scale-95
          "
        >

          <i
            data-lucide="play"
            class="
              h-7
              w-7
              fill-current
            "
          ></i>

        </button>


        <!-- Next -->

        <button
          id="fullNextButton"
          type="button"
          class="
            grid
            h-12
            w-12
            place-items-center
            rounded-full
            bg-white/5
            active:scale-95
          "
        >

          <i
            data-lucide="skip-forward"
            class="h-5 w-5"
          ></i>

        </button>


        <!-- Repeat Surah -->

        <button
          id="repeatButton"
          type="button"
          class="
            grid
            h-11
            min-w-11
            place-items-center
            rounded-full
            border
            border-white/10
            bg-white/5
            text-slate-300
            active:scale-95
          "
        >

          <i
            data-lucide="repeat"
            class="h-4 w-4"
          ></i>

        </button>

      </div>


      <!-- Repeat status -->

      <p
        id="repeatLabel"
        class="
          mt-3
          text-center
          text-[11px]
          text-slate-500
        "
      >
        Repeat off
      </p>


      <!-- Reciter -->

      <div class="mt-7">

        <label
          for="reciterSelect"
          class="
            mb-2
            block
            text-xs
            font-semibold
            uppercase
            tracking-wider
            text-slate-500
          "
        >
          Reciter
        </label>


        <div
          class="
            relative
            overflow-hidden
            rounded-2xl
            border
            border-white/10
            bg-white/5
          "
        >

          <select
            id="reciterSelect"
            class="
              w-full
              appearance-none
              bg-transparent
              px-4
              py-4
              pr-12
              text-sm
              outline-none
            "
          >

            <option
              value="Alafasy_128kbps"
              class="bg-slate-900"
            >
              Mishary Rashid Alafasy
            </option>

            <option
              value="Abdul_Basit_Murattal_192kbps"
              class="bg-slate-900"
            >
              Abdul Basit Abdul Samad
            </option>

            <option
              value="Abdurrahmaan_As-Sudais_192kbps"
              class="bg-slate-900"
            >
              Abdul Rahman Al-Sudais
            </option>

            <option
              value="Husary_128kbps"
              class="bg-slate-900"
            >
              Mahmoud Khalil Al-Husary
            </option>

            <option
              value="Saood_ash-Shuraym_128kbps"
              class="bg-slate-900"
            >
              Saud Al-Shuraim
            </option>

            <option
              value="Abu_Bakr_Ash-Shaatree_128kbps"
              class="bg-slate-900"
            >
              Abu Bakr Al-Shatri
            </option>

          </select>


          <i
            data-lucide="chevron-down"
            class="
              pointer-events-none
              absolute
              right-4
              top-1/2
              h-4
              w-4
              -translate-y-1/2
              text-slate-400
            "
          ></i>

        </div>

      </div>


    </section>


  </div>


  <!-- App JS -->

  <script src="surah.js"></script>

</body>

</html>
