<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f172a"
  >

  <meta
    name="description"
    content="Quran Reader - Read and listen to the Holy Quran"
  >

  <title>Quran Reader</title>


  <!-- Tailwind CSS -->

  <script src="https://cdn.tailwindcss.com"></script>


  <script>

    tailwind.config = {

      theme: {

        extend: {

          fontFamily: {

            arabic: [
              "Amiri",
              "serif"
            ]

          }

        }

      }

    };

  </script>


  <!-- Arabic Quran Font -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <!-- Lucide Icons -->

  <script
    src="https://unpkg.com/lucide@latest"
  ></script>

</head>


<body
  class="min-h-screen
         bg-slate-950
         text-white"
>


  <!-- APP -->

  <div
    class="mx-auto
           min-h-screen
           max-w-md
           bg-slate-900
           shadow-2xl"
  >


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header
      class="sticky
             top-0
             z-20
             border-b
             border-white/10
             bg-slate-900/95
             px-5
             py-4
             backdrop-blur"
    >

      <div
        class="flex
               items-center
               gap-3"
      >


        <!-- BACK -->

        <button
          onclick="history.back()"
          class="rounded-full
                 border
                 border-white/10
                 bg-white/5
                 p-2.5
                 transition
                 active:scale-95"
          aria-label="Go back"
        >

          <i
            data-lucide="arrow-left"
            class="h-5 w-5"
          ></i>

        </button>


        <!-- SURAH TITLE -->

        <div
          class="min-w-0"
        >

          <p
            class="text-xs
                   uppercase
                   tracking-widest
                   text-emerald-400"
          >
            Quran
          </p>


          <h1
            id="surahTitle"
            class="truncate
                   font-bold"
          >
            Loading...
          </h1>

        </div>


        <!-- BOOKMARK -->

        <button
          id="surahBookmark"
          class="ml-auto
                 rounded-full
                 border
                 border-white/10
                 bg-white/5
                 p-2.5
                 text-slate-300
                 transition
                 active:scale-95"
          aria-label="Bookmark Surah"
        >

          <i
            data-lucide="bookmark"
            class="h-5 w-5"
          ></i>

        </button>

      </div>

    </header>


    <!-- =====================================================
         QURAN CONTENT
    ====================================================== -->

    <main
      id="quranContent"
      class="px-5
             pb-40
             pt-6"
    >

      <!-- LOADING -->

      <div
        class="py-16
               text-center"
      >

        <div
          class="mx-auto
                 h-9
                 w-9
                 animate-spin
                 rounded-full
                 border-2
                 border-slate-600
                 border-t-emerald-400"
        ></div>


        <p
          class="mt-4
                 text-sm
                 text-slate-400"
        >
          Loading Surah...
        </p>

      </div>

    </main>


    <!-- =====================================================
         AUDIO PLAYER
    ====================================================== -->

    <div
      id="audioBar"
      class="fixed
             bottom-0
             left-0
             right-0
             z-30
             mx-auto
             hidden
             max-w-md
             border-t
             border-white/10
             bg-slate-900/95
             px-5
             py-4
             shadow-2xl
             backdrop-blur"
    >


      <!-- PROGRESS -->

      <div
        class="mb-3
               h-1
               w-full
               overflow-hidden
               rounded-full
               bg-slate-700"
      >

        <div
          id="audioProgress"
          class="h-full
                 w-0
                 rounded-full
                 bg-emerald-500
                 transition-all"
        ></div>

      </div>


      <div
        class="flex
               items-center
               gap-3"
      >


        <!-- PLAY / PAUSE -->

        <button
          id="playButton"
          class="grid
                 h-12
                 w-12
                 shrink-0
                 place-items-center
                 rounded-full
                 bg-emerald-500
                 text-slate-950
                 shadow-lg
                 transition
                 active:scale-95"
          aria-label="Play Quran"
        >

          <i
            data-lucide="play"
            class="h-5
                   w-5
                   fill-current"
          ></i>

        </button>


        <!-- AUDIO INFORMATION -->

        <div
          class="min-w-0
                 flex-1"
        >

          <p
            id="audioTitle"
            class="truncate
                   text-sm
                   font-semibold"
          >
            Quran Recitation
          </p>


          <p
            id="audioSubtitle"
            class="text-xs
                   text-slate-400"
          >
            Mishary Rashid Alafasy
          </p>

        </div>


        <!-- PLAYLIST -->

        <button
          id="audioPlaylistButton"
          class="rounded-full
                 border
                 border-white/10
                 p-2.5
                 text-slate-400
                 transition
                 active:scale-95"
          aria-label="Audio playlist"
        >

          <i
            data-lucide="list-music"
            class="h-5
                   w-5"
          ></i>

        </button>


        <!-- MORE -->

        <button
          id="audioMoreButton"
          class="rounded-full
                 border
                 border-white/10
                 p-2.5
                 text-slate-400
                 transition
                 active:scale-95"
          aria-label="Audio options"
        >

          <i
            data-lucide="more-vertical"
            class="h-5
                   w-5"
          ></i>

        </button>

      </div>

    </div>


  </div>


  <!-- =====================================================
       SCRIPTS
  ====================================================== -->

  <script src="surah.js"></script>


  <script>

    /*
     * Initialize Lucide icons that exist
     * before surah.js renders the Quran.
     */

    lucide.createIcons();

  </script>


</body>

</html>
