<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0f172a">

  <meta
    name="description"
    content="A clean Quran reading and listening app"
  >

  <title>Quran Reader</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            arabic: ["Amiri", "serif"]
          }
        }
      }
    };
  </script>

  <!-- Arabic Quran font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
</head>

<body class="min-h-screen bg-slate-950 text-white">

  <div class="mx-auto min-h-screen max-w-md bg-slate-900 shadow-2xl">

    <!-- HEADER -->
    <header
      class="sticky top-0 z-20 border-b border-white/10
             bg-slate-900/95 px-5 py-4 backdrop-blur"
    >

      <div class="flex items-center justify-between">

        <div>

          <p
            class="text-xs font-medium uppercase
                   tracking-[0.25em] text-emerald-400"
          >
            Quran
          </p>

          <h1 class="mt-1 text-2xl font-bold">
            Read & Listen
          </h1>

        </div>

        <button
          class="rounded-full border border-white/10
                 bg-white/5 p-3"
          aria-label="Settings"
        >

          <i
            data-lucide="settings"
            class="h-5 w-5"
          ></i>

        </button>

      </div>

    </header>


    <!-- MAIN -->
    <main class="px-5 pb-24 pt-5">


      <!-- CONTINUE READING -->
      <section
        class="rounded-3xl
               bg-gradient-to-br
               from-emerald-600
               to-teal-800
               p-5 shadow-lg"
      >

        <div class="flex items-start justify-between">

          <div>

            <p class="text-sm text-emerald-100">
              Continue reading
            </p>

            <h2 class="mt-1 text-2xl font-bold">
              Al-Fatihah
            </h2>

            <p class="mt-1 text-sm text-emerald-100">
              Surah 1 · 7 Ayahs
            </p>

          </div>


          <div
            class="rounded-2xl bg-white/10 p-3"
          >

            <i
              data-lucide="book-open"
              class="h-6 w-6"
            ></i>

          </div>

        </div>


        <button
          class="mt-5 flex w-full items-center
                 justify-center gap-2 rounded-2xl
                 bg-white px-4 py-3
                 font-semibold text-emerald-800"
        >

          <i
            data-lucide="play"
            class="h-4 w-4 fill-current"
          ></i>

          Continue

        </button>

      </section>


      <!-- SEARCH -->
      <div class="mt-6">

        <div class="relative">

          <i
            data-lucide="search"
            class="absolute left-4 top-1/2
                   h-5 w-5 -translate-y-1/2
                   text-slate-400"
          ></i>

          <input
            id="search"
            type="search"
            placeholder="Search surahs..."
            class="w-full rounded-2xl
                   border border-white/10
                   bg-slate-800
                   py-3.5 pl-12 pr-4
                   outline-none
                   placeholder:text-slate-500
                   focus:border-emerald-500"
          >

        </div>

      </div>


      <!-- SURAH HEADER -->
      <div
        class="mt-7 flex items-center
               justify-between"
      >

        <h2 class="text-lg font-bold">
          Surahs
        </h2>

        <span
          id="count"
          class="text-sm text-slate-400"
        >
          114 Surahs
        </span>

      </div>


      <!-- SURAH LIST -->
      <section
        id="surahList"
        class="mt-3 space-y-2"
      ></section>


    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav
      class="fixed bottom-0 left-0 right-0 z-30
             mx-auto flex max-w-md
             border-t border-white/10
             bg-slate-900/95
             px-5 py-3 backdrop-blur"
    >

      <button
        class="flex flex-1 flex-col
               items-center gap-1
               text-emerald-400"
      >

        <i
          data-lucide="book-open"
          class="h-5 w-5"
        ></i>

        <span class="text-[11px]">
          Read
        </span>

      </button>


      <button
        class="flex flex-1 flex-col
               items-center gap-1
               text-slate-500"
      >

        <i
          data-lucide="bookmark"
          class="h-5 w-5"
        ></i>

        <span class="text-[11px]">
          Bookmarks
        </span>

      </button>


      <button
        class="flex flex-1 flex-col
               items-center gap-1
               text-slate-500"
      >

        <i
          data-lucide="headphones"
          class="h-5 w-5"
        ></i>

        <span class="text-[11px]">
          Audio
        </span>

      </button>


      <button
        class="flex flex-1 flex-col
               items-center gap-1
               text-slate-500"
      >

        <i
          data-lucide="settings"
          class="h-5 w-5"
        ></i>

        <span class="text-[11px]">
          Settings
        </span>

      </button>

    </nav>

  </div>


  <!-- APPLICATION JAVASCRIPT -->
  <script src="app.js"></script>

</body>
</html>
